[package]
name = "agent-tasks"
version = "0.3.1"
edition = "2021"
description = "File-based task tracker CLI for agents (port of the Bash `task`)"
license = "MIT"
publish = false

[[bin]]
name = "task"
path = "src/main.rs"

[dependencies]
libc = "0.2"
serde_json = { version = "1", features = ["preserve_order"] }
